  const full=new Date(Date.UTC(p[0],p[1]-1,p[2])).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
  const pct=d.tasks.length?Math.round(d.done/d.tasks.length*100):0;
  const sub=d.tasks.length ? `${d.done} of ${d.tasks.length} done${d.ms?' · '+hm(d.ms)+' studied':''}` : (past?'Nothing was recorded':'Nothing planned yet');
  const rows=d.tasks.map(x=>{
    const sn=(subj(x.t.subject)||{}).name||'';

    if(x.acc) bits.push((x.acc.correct||0)+'/'+(x.acc.attempted||0)+' correct');

  }).join('');
  const tests=d.tests.map(x=>{
    const sc=isScored(x);

  const list=rows+tests;
  return `<div class="pl-day">
    <div class="pl-hero">
      <div class="pl-bigdate"><b>${p[2]}</b><span>${mon}</span></div>
      <div class="pl-htext"><span class="pl-rel ${past?'past':''}">${plannerRelLabel(date)}</span><h3>${wd}</h3><p>${escHtml(full)} · ${sub}</p>${d.tasks.length?`<div class="pl-prog"><i style="width:${pct}%"></i></div>`:''}</div>
    </div>
    <div class="pl-body">
      ${list?`<div class="pl-tasks">${list}</div>`:`<div class="pl-empty"><b>${past?'No activity this day':'A free day'}</b>${past?'':'Add what you want to study and it will be waiting for you on this date.'}</div>`}
      ${past?'':`<button type="button" class="pl-addbtn" data-act="plantask" data-date="${date}">＋ Add task for ${date===today?'today':escHtml(mzShortDate(date,true))}</button>`}

}

function renderPlanner(){
  const p=plannerMonth.split('-').map(Number), today=todayISO();
  const first=new Date(Date.UTC(p[0],p[1]-1,1)).getUTCDay(), days=new Date(Date.UTC(p[0],p[1],0)).getUTCDate();
  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const date=plannerMonth+'-'+String(d).padStart(2,'0'), st=dayStats(date), isFut=date>today;

    const dots=tasks.slice(0,6).map(t=>`<i class="t-${dwTypeCls(t)} ${t.done?'dn':''}"></i>`).join('')+(tasks.length>6?'<span>+'+(tasks.length-6)+'</span>':'');
    cells+=`<div class="cal-cell clickable ${date===today?'today':''} ${isFut?'future':''} ${st.total&&st.done===st.total?'has':''}" data-act="calday" data-date="${date}" role="button" tabindex="0" title="${isFut?st.total+' task'+(st.total===1?'':'s')+' planned · tap to plan':st.done+'/'+st.total+' tasks done · tap for day details'}"><b>${d}</b>`+

  return `<div class="card">

  </div>`;
}

/* ---- Syllabus: every chapter with its four checkable tasks, plus an editor for the chapter list ---- */
let sylSubject = 'physics';
let sylEdit = false;
const SYL_COLS = [['lecture','Lecture'],['notes','Notes'],['revise','Revise'],['pyq','PYQs']];
/* Only Lecture and PYQs count toward the completion bar; Notes and Revise are tracked
   for their own sake but don't move the percentage. */
const SYL_PROGRESS_COLS = ['lecture','pyq'];
function syllabusProgress(sid){
  const names=chapterNames(sid);
  let done=0;
  names.forEach(ch=>{ const c=chapterChecks(sid,ch); SYL_PROGRESS_COLS.forEach(t=>{ if(c[t]) done++; }); });
  return {done,total:names.length*SYL_PROGRESS_COLS.length};
}
/* Renaming keeps tasks and ticks attached to the chapter. */
function renameChapterAt(sid,i,value){
  const list=state.chapterList[sid], name=String(value||'').trim(), old=list[i].name;
  if(!name || name===old){ render(); return; }
  if(list.some((c,j)=>j!==i && c.name===name)){ alert('A chapter with this name already exists in '+subj(sid).name+'.'); render(); return; }
  list[i].name=name;
  state.tasks.forEach(t=>{ if(t.subject===sid && t.chapter===old) t.chapter=name; });
  if(state.syllabus[sid+'::'+old]){ state.syllabus[sid+'::'+name]=state.syllabus[sid+'::'+old]; delete state.syllabus[sid+'::'+old]; }
  saveState(); render();
}

    </div>`).join('');
  return `<div class="syl-edit-block" style="margin-bottom:14px">
    <div class="section-title" style="margin:4px 0 2px"><b>Default lecture links</b></div>
    <p class="sub" style="margin:0 0 8px">Used for Lecture-mode and JEE Adv chapters that don't have their own link.</p>

}

function renderSyllabus(){

function csvParse(text){
  text=String(text).replace(/^\uFEFF/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cell+=c;
  }
  row.push(cell); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function csvCell(v){ v=(v===null||v===undefined)?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function csvDate(raw){
  raw=String(raw||'').trim();
  let m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!m){ const m2=raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if(m2) m=[0,m2[3],m2[2],m2[1]]; }
  if(!m) return '';
  return normalizeISODate(m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'),'');
}
function splitTopics(v){ return String(v||'').split(/\s*[|;]\s*/).map(x=>x.trim()).filter(Boolean); }
function importTestsFromCsvText(text,fileName){
  const rows=csvParse(text); const res={file:fileName,added:0,skipped:0,bad:[],error:''};
  if(rows.length<2){ res.error='no data rows'; return res; }
  const norm=h=>h.trim().toLowerCase().replace(/[^a-z]/g,'');
  const alias={category:'category',type:'category',exam:'category',name:'name',test:'name',testname:'name',date:'date',testdate:'date',
    physics:'physics',phy:'physics',chemistry:'chemistry',chem:'chemistry',maths:'maths',math:'maths',mathematics:'maths',
    scored:'scored',marks:'scored',score:'scored',total:'total',totalmarks:'total',maxmarks:'total'};
  const col={}; rows[0].forEach((h,i)=>{ const k=alias[norm(h)]; if(k&&!(k in col)) col[k]=i; });
  if(!('date' in col)||!('name' in col)){ res.error='needs at least "name" and "date" columns'; return res; }
  const get=(r,k)=>(k in col && r[col[k]]!==undefined) ? r[col[k]].trim() : '';
  const defCat=testTypes()[0]||'Test';
  rows.slice(1).forEach((r,ri)=>{
    const line=ri+2, name=get(r,'name'), date=csvDate(get(r,'date'));
    if(!name){ res.bad.push('row '+line+': missing name'); return; }
    if(!date){ res.bad.push('row '+line+' ('+name+'): bad date "'+get(r,'date')+'" (use YYYY-MM-DD)'); return; }
    let cat=get(r,'category')||defCat;
    const found=testCats().find(c=>c.name.toLowerCase()===cat.toLowerCase());
    if(found) cat=found.name; else state.testCategories.push({id:'cat-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:cat,total:300});
    if(state.tests.some(t=>t.type===cat && t.name.toLowerCase()===name.toLowerCase() && t.date===date)){ res.skipped++; return; }
    const sc=parseFloat(get(r,'scored')), tot=parseFloat(get(r,'total'));
    const scoredOk=Number.isFinite(sc)&&Number.isFinite(tot)&&tot>0&&sc<=tot;
    const t={id:'test-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),date,type:cat,name,scored:scoredOk?sc:null,total:scoredOk?tot:null};
    const syl=cleanSyl({physics:splitTopics(get(r,'physics')),chemistry:splitTopics(get(r,'chemistry')),maths:splitTopics(get(r,'maths'))});
    if(syl) t.syl=syl;
    state.tests.push(t); res.added++;
  });
  return res;
}
function importTestCsvFiles(files){
  const list=Array.from(files||[]); if(!list.length) return;
  const previous=JSON.stringify(state);
  Promise.all(list.map(f=>new Promise(ok=>{ const r=new FileReader(); r.onload=e=>ok({name:f.name,text:e.target.result}); r.onerror=()=>ok({name:f.name,text:null}); r.readAsText(f); }))).then(items=>{
    const results=items.map(it=>it.text===null?{file:it.name,added:0,skipped:0,bad:[],error:'could not read file'}:importTestsFromCsvText(it.text,it.name));
    if(!saveState()){ state=JSON.parse(previous); alert('Could not save the imported tests.'); return; }
    render();
    alert(results.map(r=>r.file+': '+(r.error?'not imported ('+r.error+')':r.added+' added'+(r.skipped?', '+r.skipped+' duplicate(s) skipped':'')+(r.bad.length?', '+r.bad.length+' row(s) ignored:\n   '+r.bad.slice(0,5).join('\n   ')+(r.bad.length>5?'\n   …':''):''))).join('\n\n'));
  });
}
function exportTestsCsv(){
  if(!state.tests.length){ alert('No tests to export yet.'); return; }
  const head=['category','name','date','physics','chemistry','maths','scored','total'];
  const lines=[head.join(',')].concat(sortedTests().map(t=>{

  }));
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});

function renameCategory(id,value){

  state.tests.forEach(t=>{ if(t.type===old) t.type=name; });

function deleteCategory(id){

/* ---- Weekly off day: suggestions only, nothing is added to the task list ---- */
/* ---- Weekend suggestions: revise the next test's chapters; PYQs for the oldest learned chapters ---- */
const TOPIC_ALIASES={
  'motion 1d':['Motion in a Straight Line'],'motion 2d':['Motion in a Plane'],'maths in physics':['Mathematical Tools'],
  'units and dimensions':['Units and Measurements'],'com momentum and collision':['Centre of Mass & System of Particles'],
  'atomic physics':['Modern Physics'],'dual nature':['Modern Physics'],'nuclear physics':['Modern Physics'],'ktg':['Kinetic Theory'],
  'thermal prop':['Thermal Properties of Matter'],'mech prop fluids':['Mechanical Properties of Fluids'],'mech prop solids':['Mechanical Properties of Solids'],
  'electrostatics':['Electric Charges and Fields','Electrostatic Potential and Capacitance'],'capacitance':['Electrostatic Potential and Capacitance'],
  'magnetic effects of current':['Moving Charges and Magnetism'],'magnetic prop of matter':['Magnetism and Matter'],'em induction':['Electromagnetic Induction'],
  'em waves':['Electromagnetic Waves'],'waves and sound':['Waves'],'semiconductors':['Semiconductor Electronics'],
  'periodicity':['Classification of Elements and Periodicity in Properties'],'chemical bonding':['Chemical Bonding and Molecular Structure'],
  'redox reactions':['Redox Reaction'],'thermodynamics c':['Thermodynamics'],'hydrocarbons':['Hydrocarbon'],'d and f block':['The d and f-Block Elements'],'p block':['P-block Elements'],
  'aldehydes and ketones':['Aldehydes, Ketones and Carboxylic Acids'],'carboxylic acid derivatives':['Aldehydes, Ketones and Carboxylic Acids'],
  'general organic chemistry':['GOC'],'iupac nomenclature':['IUPAC'],
  'basic of maths':['Basic Mathematics'],'quadratic eq':['Quadratic Equations'],'sequences and series':['Sequence and Series'],'trigonometric equations':['Trigonometric Equation'],
  'pnc':['Permutations and Combinations'],'circle':['Circles'],'parabola':['Conic Sections:Parabola'],'ellipse':['Conic Sections:Ellipse'],'hyperbola':['Conic Sections:Hyperbola'],
  'sets and relations':['Sets','Relations and Functions'],'functions':['Relations and Functions'],'inverse trigonometry':['Inverse Trigonometric Functions'],
  'limits':['Limit, Continuity and Differentiability'],'continuity and diff':['Limit, Continuity and Differentiability'],'area under curves':['Application of integrals'],
  'differential equations':['Differential Equation'],'3d geometry':['Three Dimensional Geometry']
};
function topicKey(x){ return String(x||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim(); }
function topicTokens(x){ return topicKey(x).split(' ').filter(w=>w && ['and','of','in','a','the','to'].indexOf(w)<0).map(w=>w.replace(/(es|s)$/,'')); }
/* Map a test's free-text topic to real chapters ({sid,ch}); returns [] when nothing fits well. */
function matchTopicChapters(topic,testSub){
  const sids=testSub==='chemistry' ? ['inorganic','organic','physical'] : [testSub];
  const pool=[]; sids.forEach(sid=>chapterNames(sid).forEach(ch=>pool.push({sid,ch})));
  const key=topicKey(topic);
  const exact=pool.filter(p=>topicKey(p.ch)===key); if(exact.length) return exact.slice(0,1);
  const al=TOPIC_ALIASES[key];
  if(al){ const m=pool.filter(p=>al.indexOf(p.ch)>=0); if(m.length) return m; }
  const tt=topicTokens(topic); if(!tt.length) return [];
  let best=null, bs=0;
  pool.forEach(p=>{ const ct=topicTokens(p.ch), hit=tt.filter(w=>ct.indexOf(w)>=0).length, sc=hit/Math.max(tt.length,1)*0.7+hit/Math.max(ct.length,1)*0.3; if(hit/tt.length>=0.6 && sc>bs){ bs=sc; best=p; } });
  return (best && bs>=0.5) ? [best] : [];
}
/* Next upcoming test that lists chapters; returns {test, items:[{ch,sname}]} of chapters whose revision isn't done. */
function nextTestRevision(){
  for(const t of upcomingTests()){
    if(!t.syl) continue;
    const items=[], seen={};
    TEST_SYL_SUBJECTS.forEach(([k,sname])=>(t.syl[k]||[]).forEach(topic=>{
      if(/syllabus/i.test(topic)) return;
      const m=matchTopicChapters(topic,k);
      if(m.length){ m.forEach(p=>{ const id=p.sid+'::'+p.ch; if(seen[id]) return; seen[id]=1; if(!reviseCount(chapterChecks(p.sid,p.ch))) items.push({ch:p.ch,sname}); }); }
      else { const id='x::'+topic; if(!seen[id]){ seen[id]=1; items.push({ch:topic,sname}); } }   // can't tell its status, so keep it
    }));
    if(items.length) return {test:t,items:items.slice(0,4)};   // at most 4 chapters
  }
  return null;
}
function renderHolidayTips(){
  if(!isOffDay(todayISO())) return '';
  const nt=nextTestRevision();
  /* PYQs: the 2 oldest learned chapters without PYQs, from different subjects where possible. */
  const learned=[];
  SUBJECTS.forEach(s=>chapterNames(s.id).forEach(ch=>{
    const c=chapterChecks(s.id,ch); if(!c.lecture || c.pyq) return;
    const ds=state.tasks.filter(t=>t.subject===s.id && t.chapter===ch && t.type==='lecture' && t.done && t.date).map(t=>t.date).sort();
    learned.push({ch,sid:s.id,sname:s.name,date:ds[0]||'',idx:learned.length});
  }));
  learned.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.idx-y.idx);
  const pyq=[], used={};
  for(let n=0;n<2;n++){
    const open=learned.filter(x=>pyq.indexOf(x)<0), best=open.find(x=>!used[x.sid])||open[0];
    if(best){ pyq.push(best); used[best.sid]=1; }
  }
  const fmt=arr=>arr.map(x=>escHtml(x.ch)+' <span class="sub">('+escHtml(x.sname)+')</span>').join(' · ');
  return `<div class="card">
    <div class="daily-kicker">Weekly off</div>
    <h2>It’s ${WEEKDAYS[state.holidayWeekday]}, a holiday</h2>
    <div class="daily-note"><b>Revise notes${nt?' for '+escHtml(nt.test.name)+' ('+escHtml(fmtDate(nt.test.date))+')':''}:</b> ${nt?fmt(nt.items):'no upcoming test with chapters left to revise'}</div>
    <div class="daily-note" style="margin-top:8px"><b>Solve PYQs:</b> ${pyq.length?fmt(pyq):'nothing pending, all learned chapters have PYQs done'}</div>
  </div>`;
}
