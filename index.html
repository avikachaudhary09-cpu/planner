.layout{display:flex;width:100%;margin:0 auto}

.qstrip{display:flex;flex-wrap:wrap}

input[type=number],
input[type=date],
input[type=password],
select{min-height:42px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13.5px}
input[type=text]:focus,
input[type=number]:focus,
input[type=date]:focus,
input[type=password]:focus,
select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 13%,transparent)}
.btn{min-height:42px;padding:11px 17px;border-radius:12px;background:var(--accent);font-size:13px;font-weight:750;box-shadow:0 7px 16px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn.ghost{color:var(--text);background:var(--panel2);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--panel3);border-color:var(--accent)}
.btn.sm{min-height:34px;padding:8px 12px;border-radius:10px;font-size:12px}
.btnrow{margin-top:24px}
.pill{padding:5px 10px;border-radius:9px;font-size:10px;font-weight:800;letter-spacing:.045em;text-transform:uppercase}
.sidebar h3{margin:0 0 5px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sidebar p.sub{font-size:12.5px;line-height:1.55}
.sidebar > div{padding:22px;border:1px solid var(--line-soft);border-radius:22px;background:linear-gradient(155deg,var(--panel),var(--panel2));box-shadow:var(--shadow)}
.sidebar .progress-outer{height:9px;margin-top:13px}
.sidebar #sb-quickadd{margin-top:4px;background:var(--text);color:var(--bg);border:0}
body.dark .sidebar #sb-quickadd{background:var(--accent);color:var(--accent-ink)}
.progress-outer{height:8px;margin-top:10px;background:var(--panel3)}
.progress-inner{background:linear-gradient(90deg,var(--accent),#9b7bf0)}
.quotebar{position:relative;overflow:hidden;margin-bottom:16px;padding:20px 24px 20px 28px;border-radius:18px;background:linear-gradient(110deg,#3e3b9c,var(--accent));color:#fff;box-shadow:0 12px 26px rgba(89,87,214,.2);font-size:15px;font-weight:650}
.quotebar:after{content:"";position:absolute;width:150px;height:150px;right:-35px;top:-75px;border:1px solid rgba(255,255,255,.2);border-radius:50%;box-shadow:0 0 0 18px rgba(255,255,255,.04),0 0 0 38px rgba(255,255,255,.035)}
.qstrip{gap:10px}
.qstrip .qstat{min-width:120px;padding:16px;border:1px solid var(--line-soft);border-radius:16px;background:var(--panel2)}
.qstrip .qstat b{font-size:25px;font-weight:800}
.qstrip .qstat span{font-size:10px;font-weight:800;letter-spacing:.07em}
.stat{min-height:78px;padding:16px 17px;border:1px solid var(--line-soft);border-radius:16px;background:var(--panel2)}
.stat b{font-size:24px;font-weight:800}
.stat span{font-size:10.5px;font-weight:700;letter-spacing:.03em}
.taskrow{min-height:62px;gap:13px;padding:14px 4px;border-bottom-color:var(--line-soft)}
.taskrow input[type=checkbox]{width:22px;height:22px;border-width:2px;border-color:#cbd3c9}
.taskrow input[type=checkbox]:checked{background:var(--good);border-color:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 13%,transparent)}
.taskrow .txt{font-size:13.5px;font-weight:600}
.taskrow .sub{font-size:11.5px;color:var(--muted)}
.taskrow .openbtn{padding:8px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:11.5px;font-weight:750}
.taskrow .openbtn:hover{border-color:var(--accent);background:var(--panel3)}
.note{border:1px solid var(--line-soft);border-radius:13px;background:var(--panel2);padding:13px 15px}
.section-title{color:var(--muted);font-size:10.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
@media (max-width:1100px){
  .layout{gap:24px;padding:0 24px}
  .sidebar{width:270px}
  .rightbar{width:230px}
}
@media (max-width:820px){
  .layout{padding:0 18px}
  .sidebar{padding:18px 0 4px;min-height:0}
  .rightbar{width:auto;min-height:0;padding:4px 0 18px;position:static;overflow:visible}
  .wrap{padding-bottom:70px}
  header.top{padding:24px 0 20px}
  .brand h1{font-size:18px}
  .card{padding:20px;border-radius:18px}
}
@media (max-width:560px){
  .qstrip .qstat{min-width:calc(50% - 5px)}
  .stat{min-width:calc(50% - 6px)}
  .taskrow .openbtn{width:100%;margin-left:35px}
}
/* ---- iOS / Android mobile pass ---- */
html,
body{overflow-x:hidden}
button,
a,
input,
select{touch-action:manipulation}
@media (max-width:820px){
  .layout{width:100%;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));gap:0}
  .sidebar,
.wrap,
.rightbar{width:100%;max-width:none;min-width:0}
  .sidebar{padding:calc(14px + env(safe-area-inset-top)) 0 4px;position:static}
  .sidebar-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:14px}
  .sidebar-nav-label{grid-column:1 / -1}
  .sidebar-nav button{min-height:46px;padding:8px 10px;font-size:14px}
  .sidebar-nav button .nav-icon{width:28px;height:28px;flex-basis:28px}
  .sidebar > div{padding:16px;border-radius:18px}
  header.top{padding:18px 0 16px}
  .brand h1{font-size:19px}
  .brand span{font-size:11px;max-width:210px}
  .card{width:100%;padding:18px;border-radius:17px}
  .row > label.field{min-width:0;flex:1 1 100%}
  input[type=text],
input[type=number],
input[type=date],
input[type=password],
select{font-size:16px;min-height:44px}
  .btn{min-height:44px}
  .iconbtn{width:44px;height:44px;flex:0 0 44px}
  .rightbar{padding:4px 0 calc(24px + env(safe-area-inset-bottom));position:static;overflow:visible}
  .rightbar > .card{padding:16px}
  .taskrow .txt{min-width:0;overflow-wrap:anywhere}
}
@media (max-width:560px){
  .layout{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .brand{gap:9px}
  .brand .mark{width:40px;height:40px;border-radius:13px}
  .brand h1{font-size:18px}
  .brand span{font-size:10.5px}
  .card{padding:16px}
  .sidebar-nav button{font-size:13px}
  .sidebar-nav button .nav-icon{width:26px;height:26px;flex-basis:26px}
  .qstrip .qstat{min-width:0}
  .stat{min-width:0}
  .taskrow{align-items:flex-start;padding:13px 2px}
  .taskrow .openbtn{width:calc(100% - 35px);margin-left:35px}
  .btnrow{align-items:stretch}
  .btnrow .btn{width:100%}
}
/* ===== EXTRA FEATURES ===== */
input[type=time]{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=time]:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.mz-exampill{white-space:nowrap}
.mz-exam{display:flex;align-items:center;gap:18px}
.mz-exam-num{min-width:86px;text-align:center;padding:12px 10px;border-radius:var(--radius-sm);background:var(--one-bg);color:var(--one);display:flex;flex-direction:column;line-height:1.05}
.mz-exam-num b{font-size:34px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mz-exam-num span{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.mz-exam-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.mz-exam-copy b{font-size:15px;font-weight:650}
.mz-exam-copy span{font-size:12.5px;color:var(--muted)}
.mz-exam-copy em{font-style:normal;font-size:12.5px;font-weight:560;margin-top:4px}
.mz-good{color:var(--good)}
.mz-warn{color:var(--warn)}
.mz-prompt{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 18px;border:1px dashed var(--line)}
.mz-prompt b{display:block;font-size:14px}
.mz-prompt span{font-size:12.5px;color:var(--muted)}
.mz-prompt-btns{display:flex;gap:8px}
.mz-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));z-index:1100;width:calc(100% - 28px);max-width:460px;background:var(--panel);color:var(--text);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mz-toast b{display:block;font-size:14px}
.mz-toast span{font-size:12.5px;color:var(--muted)}
.mz-toast-btns{display:flex;gap:8px}
@media (max-width:560px){
  .mz-exam{gap:12px}
  .mz-exam-num{min-width:72px}
  .mz-exam-num b{font-size:28px}
  .mz-toast-btns .btn,
.mz-prompt-btns .btn{width:auto}
}
/* ---- User-led daily workflow + saved timers ---- */
.daily-hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}
.daily-hero > .btn{white-space:nowrap;flex-shrink:0}
.daily-kicker{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.daily-hero h2{margin-bottom:6px}
.daily-date-card{background:var(--panel3);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:128px;text-align:right}
.daily-date-card b{display:block;font-size:20px;letter-spacing:-.04em}
.daily-date-card span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.daily-task-list{margin-top:16px}
.daily-task-wrap{border-bottom:1px solid var(--line-soft)}
.daily-task-wrap .daily-task{border-bottom:0}
.daily-subtask{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:4px 4px 14px 30px}
.daily-subtask input[type=checkbox]{width:18px;height:18px;flex-shrink:0}
.daily-subtask-copy{min-width:0}
.daily-subtask-title{font-size:12.5px;font-weight:650;color:var(--text);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.daily-subtask-title.done{color:var(--muted);text-decoration:line-through}
.daily-subtask-title:before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-left:1.5px solid var(--muted2);border-bottom:1.5px solid var(--muted2);vertical-align:2px;text-decoration:none}
.daily-subtask-meta{font-size:10.5px;color:var(--muted)}
.daily-subtask .daily-chip{font-size:8.5px;padding:3px 7px}
.daily-subtask .daily-task-controls{display:flex;align-items:center;gap:8px}
.daily-task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 4px;border-bottom:1px solid var(--line-soft)}
.daily-task:last-child{border-bottom:none}
.daily-task-copy{min-width:0}
.daily-task-title{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daily-task-title.done{text-decoration:line-through;color:var(--muted)}
.daily-task-meta{font-size:11.5px;color:var(--muted);margin-top:5px}
.daily-task-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.daily-task-controls .openbtn{width:34px;height:34px;padding:0;box-sizing:border-box;border-radius:50%;background:var(--accent);color:#fff;text-decoration:none;flex-shrink:0;transition:opacity .15s var(--ease),transform .12s var(--ease);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.daily-task-controls .openbtn:hover{opacity:.88}
.daily-task-controls .openbtn:active{transform:scale(.96)}
.mz-clockbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 15%,var(--panel2));color:var(--accent);cursor:pointer;flex-shrink:0;padding:0;position:relative;transition:all .16s var(--ease)}
.mz-clockbtn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 24%,var(--panel2))}
.mz-clockbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 45%,transparent)}
.mz-clockbtn.running{border-color:#ff5a5f;color:#ff5a5f;background:color-mix(in srgb,#ff5a5f 15%,var(--panel2))}
.mz-clockbtn.running.active{background:#ff5a5f;border-color:#ff5a5f;color:#fff}
.mz-clockbtn.running::after{content:'';position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:#ff5a5f;box-shadow:0 0 0 2px var(--panel);animation:mzclockpulse 1.4s ease-in-out infinite}
@keyframes mzclockpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}
.mz-float-timer{position:fixed;z-index:9999;bottom:26px;right:26px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:14px 16px;min-width:190px;user-select:none}
.mz-float-head{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:move;font-size:11.5px;font-weight:650;color:var(--muted);margin-bottom:10px}
.mz-float-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mz-float-close{flex-shrink:0;background:none;border:none;font-size:17px;line-height:1;color:var(--muted);cursor:pointer;padding:0 2px}
.mz-float-close:hover{color:var(--text)}
.mz-float-display{font:700 32px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;letter-spacing:.5px;margin-bottom:12px;color:var(--text);font-variant-numeric:tabular-nums}
.mz-float-display.active{color:var(--accent)}
.mz-float-timer .btn{width:100%}
.mz-float-pop{display:block;width:100%;background:none;border:none;color:var(--muted);cursor:pointer;font-size:11.5px;margin-top:9px;text-align:center;padding:2px}
.mz-float-pop:hover{color:var(--accent)}
.daily-empty{padding:20px 4px;color:var(--muted);font-size:13px}
.daily-note{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;padding:11px 12px;color:var(--text);font-size:12px;margin:12px 0}
.daily-modal-backdrop{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(18,24,38,.48);backdrop-filter:blur(7px)}
.daily-modal{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px rgba(18,24,38,.28);padding:24px}
.daily-modal .daily-kicker{color:var(--accent)}
.daily-task.type-core{border-left:4px solid var(--teal);padding-left:12px}
.daily-task.type-practice{border-left:4px solid var(--warn);padding-left:12px}
.daily-task.type-notes{border-left:4px solid var(--purple);padding-left:12px}
.daily-task.type-notes-revision{border-left:4px solid var(--good);padding-left:12px}
.daily-task.type-test{border-left:4px solid var(--one);padding-left:12px}
.daily-task .openbtn{white-space:nowrap}
.daily-chip.core{background:var(--teal-bg);color:var(--teal)}
.daily-chip.practice{background:var(--warn-bg,var(--chip));color:var(--warn)}
.daily-chip.revision{background:var(--teal-bg,var(--chip));color:var(--teal)}
.daily-chip.notes{background:var(--purple-bg,var(--chip));color:var(--purple)}
.daily-chip.notes-revision{background:var(--good-bg);color:var(--good)}
.daily-chip.questions{background:var(--purple-bg,var(--chip));color:var(--purple)}
.daily-chip.test{background:var(--one-bg);color:var(--one)}
.daily-chip.dpp{background:var(--purple-bg,var(--chip));color:var(--purple)}
.daily-task.type-dpp{border-left:4px solid var(--purple);padding-left:12px}
/* ---- Exam updates (At a glance) ---- */
.xu-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.xu-head .section-title{margin:0}
.xu-refresh{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;height:26px;padding:0 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.xu-refresh:hover{color:var(--accent);border-color:var(--accent)}
.xu-refresh[disabled]{opacity:.5;cursor:default}
.xu-item{padding:9px 0;border-top:1px solid var(--line-soft)}
.xu-item:first-of-type{border-top:0;padding-top:0}
.xu-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.xu-exam{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;background:var(--panel3);color:var(--text)}
.xu-chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.xu-chip.reg_open{background:var(--good-bg);color:var(--good)}
.xu-chip.reg_closing{background:var(--warn-bg);color:var(--warn)}
.xu-chip.dates{background:var(--accent-bg,var(--chip));color:var(--accent)}
.xu-title{font-size:12.5px;line-height:1.35;font-weight:600}
.xu-date{font-size:11.5px;color:var(--muted);margin-top:2px}
.xu-note{font-size:12px;color:var(--muted);line-height:1.4}
.xu-foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--muted);line-height:1.5}
.xu-foot a{color:var(--accent);text-decoration:none;font-weight:600}
.xu-foot a:hover{text-decoration:underline}
.daily-progress-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.daily-metric{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:12px}
.daily-metric b{display:block;font-size:20px;letter-spacing:-.04em}
.daily-metric span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.daily-metric small{display:block;margin-top:5px;font-size:10.5px}
.daily-metric small.up{color:var(--good)}
.daily-metric small.down{color:var(--one)}
.daily-history-row{display:grid;grid-template-columns:120px minmax(0,1fr) 86px 86px 86px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.daily-history-row:last-child{border-bottom:none}
.daily-history-row .muted{color:var(--muted)}
.daily-history-row .right{text-align:right;font-variant-numeric:tabular-nums}
.daily-chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;background:var(--chip);color:var(--muted);font-size:10px;font-weight:700}
.daily-chip.done{background:var(--good-bg);color:var(--good)}
.daily-chip.warn{background:var(--warn-bg);color:var(--warn)}
@media (max-width:700px){
  .daily-hero{display:block}
  .daily-date-card{text-align:left;margin-top:14px;width:max-content}
  .daily-select-row{grid-template-columns:1fr!important}
  .daily-progress-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .daily-history-row{grid-template-columns:64px minmax(0,1fr) 68px 62px 44px;gap:6px;font-size:11px}
  .daily-history-row .right{text-align:right}
}
@media (max-width:560px){
  .daily-task{grid-template-columns:22px minmax(0,1fr)}
  .daily-task-controls{grid-column:2;justify-content:flex-start}
  .daily-task-title{font-size:13px}
}
.syl-video{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;border-radius:50%;border:0;padding:0;box-sizing:border-box;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;text-decoration:none;box-shadow:0 3px 8px color-mix(in srgb,var(--accent) 32%,transparent);transition:transform .15s,box-shadow .15s}
.syl-video:hover{transform:scale(1.1);box-shadow:0 5px 12px color-mix(in srgb,var(--accent) 42%,transparent)}
.syl-video:active{transform:scale(.96)}
.task-del{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--one);font-size:26px;font-weight:600;line-height:1;cursor:pointer;padding:0 0 3px}
.task-del:hover{background:var(--one-bg);border-color:var(--one)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-head h2{margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.cal-dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal-cell{border:1px solid var(--line-soft);border-radius:10px;min-height:78px;padding:6px;font-size:11.5px;overflow:hidden}
.cal-cell.empty{border:none}
.cal-cell b{display:block;font-size:13px;margin-bottom:2px}
.cal-cell span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cell.has{background:var(--good-bg)}

/* ================= Sketch layout: icon rail | main | at-a-glance | AI chat ================= */
.layout{display:grid;grid-template-columns:72px 280px minmax(0,1fr) 340px;gap:0;max-width:none;width:100%;margin:0;padding:0;min-height:100vh;align-items:stretch}
.sidebar{width:auto;min-height:100vh;height:100vh;position:sticky;top:0;padding:18px 0;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel2);border-right:1px solid var(--line);overflow:visible}
.sidebar-nav{display:flex;flex-direction:column;gap:10px;margin:8px 0 0;align-items:center}
.sidebar-nav button{width:44px;min-height:44px;height:44px;padding:0;justify-content:center;border-radius:13px}
.sidebar-nav button .nav-text{display:none}
.sidebar-nav button .nav-icon{width:34px;height:34px;flex:0 0 34px;font-size:18px;background:transparent}
.rail-theme{margin-top:auto;width:44px;height:44px;border:1px solid var(--line);background:var(--panel);font-size:18px}
.wrap{grid-column:3;grid-row:1;max-width:none;padding:0 28px 80px;min-width:0}
header.top{padding:26px 0 18px;align-items:center;gap:12px;flex-wrap:wrap}
.rightbar{grid-column:2;grid-row:1;width:auto;position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 6px 30px 22px;display:flex;flex-direction:column;gap:14px}
.rightbar .rightbar-label{padding:0 2px 0;margin:0}
.rightbar > .card{margin:0}
.chatbar{grid-column:4;grid-row:1;position:sticky;top:0;height:100vh;padding:18px 18px 18px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chatbar .ai-chat-card{flex:1 1 auto;margin:0;min-height:0;height:100%;border-radius:18px}
.chatbar .ai-chat-messages,.chatbar .ai-chat-messages.nokey{height:auto;flex:1 1 0;min-height:0;overflow-y:auto}
.chatbar .ai-chat-messages.nokey{justify-content:center}
.chatbar .ai-chat-input-row{border-top:1px solid var(--line-soft)}

/* dark hero: quote band + countdown */
.mz-hero{margin-bottom:18px;border-radius:20px;overflow:hidden;color:#f5f4ff;background:linear-gradient(135deg,#15152e 0%,#23205a 60%,#2f2b86 100%);box-shadow:0 14px 30px rgba(34,30,100,.22);border:1px solid rgba(255,255,255,.08)}
.mz-hero-quote{padding:16px 24px 16px;border-bottom:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
.mz-hero-label{display:block;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:6px}
.mz-hero-quote p{margin:0;font-size:15px;font-weight:600;line-height:1.5;letter-spacing:-.005em}
.mz-hero .card{background:transparent;border:0;box-shadow:none;border-radius:0;margin:0;padding:18px 24px;color:inherit}
.mz-hero .mz-exam-num{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.28);min-width:96px}
.mz-hero .mz-exam-copy span{color:rgba(255,255,255,.72)}
.mz-hero .mz-exam-copy em,.mz-hero .mz-good{color:#a8f0c3}
.mz-hero .mz-warn{color:#ffd28a}
.mz-hero .mz-prompt{border:0}
.mz-hero .mz-prompt span{color:rgba(255,255,255,.72)}

/* medium: chat drops under the content */
@media (max-width:1280px){
  .layout{grid-template-columns:72px 270px minmax(0,1fr)}
  .chatbar{grid-row:2;grid-column:2 / -1;position:static;height:520px;border-left:0;padding:0 28px 40px 28px}
}

  .sidebar-nav{display:flex;flex-direction:row;gap:6px;margin:0}

/* ---- sizing fixes ---- */
.layout{grid-template-columns:72px 300px minmax(0,1fr) 330px}
.rightbar{overflow-x:hidden;padding:26px 14px 30px 18px}
.rightbar > *{min-width:0;max-width:100%}

/* ---- Shortcuts: icon-only + predict links ---- */
.shortcut-icons{display:flex;gap:8px;justify-content:space-between}
.shortcut-icon{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line-soft);transition:background .15s var(--ease),transform .1s var(--ease)}
.shortcut-icon:hover{background:var(--line-soft)}

.shortcut-icon img{width:20px;height:20px;border-radius:5px}
.shortcut-sub{margin:12px 0 7px;color:var(--muted);font-size:9.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
.predict-row{display:flex;gap:6px;margin-top:8px}
.predict-link{flex:1;min-width:0;text-align:center;padding:8px 4px;border-radius:11px;background:var(--panel2);border:1px solid var(--line-soft);color:var(--text);text-decoration:none;font-size:11.5px;font-weight:650;transition:background .15s var(--ease),transform .1s var(--ease)}
.predict-link:hover{background:var(--line-soft)}

/* ---- light theme hero ---- */
body:not(.dark) .mz-hero{color:var(--text);background:linear-gradient(135deg,#f4f3ff 0%,#eceaff 100%);border:1px solid #dedaf7;box-shadow:0 8px 22px rgba(89,87,214,.10)}

.mz-hero-quote{padding:18px 24px}

/* ============================ DATES & HELPERS ============================ */
function todayISO(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function normalizeISODate(value,fallback){
  const raw = String(value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return fallback;
  const parts = raw.split('-').map(Number);
  const dt = new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  return dt.getUTCFullYear()===parts[0] &&
    dt.getUTCMonth()===parts[1]-1 &&
    dt.getUTCDate()===parts[2] ? raw : fallback;
}
function addDays(iso,n){
  iso = normalizeISODate(iso,todayISO());
  const parts = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  dt.setUTCDate(dt.getUTCDate()+n);
  return dt.toISOString().slice(0,10);
}
function fmtDate(iso){
  const parts = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  return dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
}
function todaysQuote(){
  const d = new Date();
  const dayOfYear = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/86400000);
  return QUOTES[((dayOfYear%QUOTES.length)+QUOTES.length)%QUOTES.length];
}
function escHtml(s){
  return String(s??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}
function escAttr(s){ return escHtml(s); }
function externalHref(value){
  const raw = String(value||'').trim();
  if(!raw) return '';
  const candidate = /^[a-z][a-z\d+\-.]*:/i.test(raw) ? raw : 'https://'+raw;
  try{
    const url = new URL(candidate);
    return (url.protocol==='http:' || url.protocol==='https:') ? url.href : '';
  }catch(e){ return ''; }
}
function mzDaysBetween(a,b){
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);
}
function mzPlural(n,word){ return n+' '+word+(n===1?'':'s'); }

function taskId(date,type,sid,ch){ return ['daily',date,type,sid,ch].join('::'); }
/* Older saves stored a chosen chapter per day; turn those into plain tasks so history and timers survive. */
function legacyTasks(old){
  const out=[], setups=old.dailySetups||{}, status=old.dailyTaskStatus||{}, logs=old.dailyTimeLogs||{};
  const LEG={lecture:'lecture',practice:'pyq',notes:'notes','notes-revision':'revise'};
  Object.keys(setups).forEach(date=>{
    const s=setups[date], prev=setups[addDays(date,-1)];
    if(!s || !s.subject || !s.chapter || !normalizeISODate(date,'')) return;
    const list=[['lecture',s],['practice',s]];
    if(prev && prev.subject && prev.chapter) list.push(['notes-revision',prev]);
    list.forEach(([t,c])=>{
      let id=taskId(date,t,c.subject,c.chapter);
      if(t==='lecture'){ const alt=taskId(date,'oneshot',c.subject,c.chapter); if(status[alt]||logs[alt]) id=alt; }
      out.push({id,date,type:LEG[t],subject:c.subject,chapter:c.chapter,done:!!status[id]});
    });
  });
  return out;
}
/* Retires the old organic "1 lecture a day" plan (runs once, when an old save is loaded).
   - unfinished, never-started plan lectures / DPPs are dropped
   - finished or started ones stay as ordinary tasks so history and timers survive
   - a chapter whose lectures were all done gets its Syllabus Lecture box ticked */
function retireOrganicPlan(s,op){
  if(!op || typeof op!=='object') return;
  const done=new Set(); let start=0;
  const hand=Array.isArray(op.doneLecs) ? op.doneLecs : Array.from({length:Math.max(0,Math.floor(Number(op.baseDone))||0)},(_,i)=>i+1);
  hand.forEach(n=>{ n=Math.floor(Number(n)); if(n>0) done.add(n); });
  s.tasks.forEach(t=>{ if(t.lec && t.type==='lecture' && t.subject==='organic' && t.done) done.add(t.lec); });
  LEGACY_ORGANIC_LECS.forEach(([name,n])=>{
    let all=n>0; for(let k=1;k<=n;k++) if(!done.has(start+k)){ all=false; break; }
    start+=n;
    if(all && (s.chapterList.organic||[]).some(c=>c.name===name)){
      const key='organic::'+name; s.syllabus[key]=Object.assign({},s.syllabus[key],{lecture:true});
    }
  });
  const a=s.dailyActiveTimer, logs=s.dailyTimeLogs||{};
  const started=t=>t.done || (a && a.taskId===t.id) || ((logs[t.id]||{}).totalMs>0);
  const gone=new Set(s.tasks.filter(t=>(t.lec || t.dppFor) && !started(t)).map(t=>t.id));
  gone.forEach(id=>{ delete logs[id]; if(s.questionAccuracy) delete s.questionAccuracy[id]; });
  s.tasks=s.tasks.filter(t=>!gone.has(t.id));
  s.tasks.forEach(t=>{ delete t.lec; delete t.extra; delete t.dppFor; });
}
function migrateState(p){

    Object.keys(s.syllabus).forEach(k=>{ const o=s.syllabus[k]; if(o && o.revise!==undefined){ const n=reviseCount(o); if(n>0) o.revise=n; else delete o.revise; } });
  }

     everyone onto the current batch curriculum. */
  const chapterListFresh = !(parseInt(p.chapterListVersion)>=CHAPTER_DATA_VERSION);
  s.chapterList=validChapterList(chapterListFresh ? null : s.chapterList);
  s.chapterListVersion=CHAPTER_DATA_VERSION;
  /* One-time fill: give any chapter that still has no link of its own the default
     oneshot video link, without touching chapters the user already set a link for. */
  if(!p.oneshotLinksApplied){
    SUBJECTS.forEach(sub=>{

        if(normChapterMode(c.mode)!=='oneshot' && c.link===defaultChapterLink(sub.id,c.name)) c.link='';

  s.lectureLinksCleaned=true;

     One-time: swap the old chapter-wise lecture links for the one-shot videos. */

    s.tests=p.testLog.filter(t=>t && normalizeISODate(t.date,'')).map(t=>({id:t.id||'test-'+t.date,date:t.date,type:t.type||'Other',name:t.type||'Test',scored:t.score,total:t.maxMarks}));

  { const legacy=(k,fb)=>{ const v=parseFloat(s.defaultTotalMarks[k]); return (Number.isFinite(v)&&v>0) ? v : fb; };
    const seen=new Set();

function loadState(){

}

/* ============================ TASKS & PROGRESS ============================ */
let addDraft = null;   // add-task form in progress: {type,sid,ch,examType,date} (date defaults to today; the Planner can set any future date)

function dailyTasksForDate(date){
  return state.tasks.filter(t=>t.date===date && t.type!=='notes').map(t=>{
    const ty=TASK_TYPES[t.type];
    return Object.assign({},t,{label:ty.label,target:ty.target});
  });
}
function dailyDatesWithTasks(){ return Array.from(new Set(state.tasks.map(t=>t.date))).sort(); }
function dailySummaryRange(fromIso,toIso){
  return dailyDatesWithTasks().filter(d=>d>=fromIso && d<=toIso).map(d=>dailySummary(d));
}
function hasTask(date,type,sid,ch){
  return state.tasks.some(t=>t.date===date && t.type===type && t.subject===sid && t.chapter===ch);
}
function addTask(date,type,sid,ch){
  if(hasTask(date,type,sid,ch)) return;
  state.tasks.push({id:taskId(date,type,sid,ch),date,type,subject:sid,chapter:ch,done:false});
}
/* Lecture adds two tasks: the lecture and its notes. PYQs and Revise add one.
   A Test task stores the chosen exam ('JEE Mains'/'BITSAT') as its subject. */
function addTasksFromDraft(d){
  if(d.type==='test'){ addTask(d.date,'test',d.examType,''); return; }
  (d.type==='lecture' ? ['lecture'] : [d.type]).forEach(t=>addTask(d.date,t,d.sid,d.ch));
}
function setTaskDone(id,done){
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.done=!!done;   // tasks never touch the Syllabus; it is ticked only by hand on the Syllabus page
}
function chapterChecks(sid,ch){ return state.syllabus[sid+'::'+ch]||{}; }
/* Revision is a count (how many times the chapter has been revised); old saves stored true = once. */
function reviseCount(c){ const n=c&&c.revise; return typeof n==='number' ? Math.max(0,Math.floor(n)) : (n?1:0); }
function changeRevise(sid,ch,delta){
  const k=sid+'::'+ch, o=state.syllabus[k]||(state.syllabus[k]={});
  const n=Math.max(0,Math.min(99,reviseCount(o)+delta));
  if(n>0) o.revise=n; else delete o.revise;
  if(!Object.keys(o).length) delete state.syllabus[k];
  state.tasks.forEach(t=>{ if(t.subject===sid && t.chapter===ch && t.type==='revise') t.done=n>0; });
}
function setSyllabus(sid,ch,type,val){
  const k=sid+'::'+ch, o=state.syllabus[k]||(state.syllabus[k]={});
  if(val) o[type]=true; else delete o[type];
  if(!Object.keys(o).length) delete state.syllabus[k];
}
/* Ticking the syllabus also completes any matching task, so both views always agree. */
function toggleSyllabus(sid,ch,type,val){
  setSyllabus(sid,ch,type,val);
  state.tasks.forEach(t=>{ if(t.subject===sid && t.chapter===ch && t.type===type){ t.done=val; if(!val) delete state.questionAccuracy[t.id]; } });
}
function deleteTask(id){
  if(state.dailyActiveTimer && state.dailyActiveTimer.taskId===id) dailyStopTimer(false);
  state.tasks=state.tasks.filter(t=>t.id!==id);
  delete state.dailyTimeLogs[id]; delete state.questionAccuracy[id];
}
function toggleTask(id,checked){
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
  if(checked && t.type==='pyq'){
    pendingAccuracyTask={id,label:'PYQs',chapter:t.chapter,count:null};
    render(); return;
  }
  if(checked && (t.type==='testmains'||t.type==='testbitsat'||t.type==='test')){
    pendingTestTask={id,examType:t.type==='testbitsat'?'BITSAT':t.type==='testmains'?'JEE Mains':t.subject};
    render(); return;
  }
  if(checked && state.dailyActiveTimer && state.dailyActiveTimer.taskId===id) dailyStopTimer(false);
  setTaskDone(id,checked);
  if(!checked) delete state.questionAccuracy[id];
  saveState(); render();
}

/* A chapter counts as learned once its Lecture task is ticked, regardless of mode. */
function lectureProgress(sid){
  const names=chapterNames(sid);
  return {done:names.filter(ch=>chapterChecks(sid,ch).lecture).length,total:names.length};
}
/* Scheduling estimate: an "Oneshot" chapter takes one full study day. A "Lecture" chapter
   is studied at the default rate of LECTURES_PER_DAY lectures a day, using that chapter's
   own lecture count (editable in Syllabus → Edit chapters). */
const LECTURES_PER_DAY = 3;
/* 'advanced' (JEE Adv-only) chapters are excluded here so they never enter the
   oneshot/lecture day math — they're done on their own timeline after JEE Mains. */
function pendingChapterList(sid){
  return (state.chapterList[sid]||[]).filter(c=>normChapterMode(c.mode)!=='advanced' && !chapterChecks(sid,c.name).lecture);
}
function syllabusWorkload(){
  let oneshotChapters=0, lectureUnits=0;
  SUBJECTS.forEach(s=>{
    pendingChapterList(s.id).forEach(c=>{
      if(normChapterMode(c.mode)==='lecture') lectureUnits+=normLectureCount(c.lectures);
      else oneshotChapters++;
    });
  });
  const lectureDays=Math.ceil(lectureUnits/LECTURES_PER_DAY);
  return {oneshotChapters,lectureUnits,lectureDays,workDays:oneshotChapters+lectureDays};
}
function isOffDay(iso){
  const p=iso.split('-').map(Number);
  return state.holidayWeekday>=0 && new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()===state.holidayWeekday;
}
/* total days = oneshot chapters left + holidays in the span + (remaining lectures / LECTURES_PER_DAY) */
function dailyProjectedFinish(){
  const today=todayISO(), w=syllabusWorkload(), remaining=w.oneshotChapters+w.lectureUnits;
  if(w.workDays===0) return Object.assign({remaining:0,offDays:0,totalDays:0,date:today},w);
  let left=w.workDays, date=today, offDays=0, totalDays=0, guard=0;
  if(state.tasks.some(t=>t.type==='lecture' && t.done && t.date===today)) date=addDays(today,1);
  while(left>0 && guard<20000){
    if(isOffDay(date)) offDays++; else left--;
    totalDays++;
    if(left<=0) break;
    date=addDays(date,1); guard++;
  }
  return Object.assign({remaining,offDays,totalDays,date},w);
}
function computeStreak(){
  const days=new Set(state.tasks.filter(t=>t.done).map(t=>t.date));
  let cursor=todayISO(), streak=0, guard=0;
  if(!days.has(cursor)) cursor=addDays(cursor,-1);
  while(days.has(cursor) && guard<3660){ streak++; cursor=addDays(cursor,-1); guard++; }
  return streak;
}

function dailyTimeLog(id){
  if(!state.dailyTimeLogs) state.dailyTimeLogs={};
  if(!state.dailyTimeLogs[id]) state.dailyTimeLogs[id]={totalMs:0,sessions:[]};
  return state.dailyTimeLogs[id];
}
function dailyCurrentMs(id){
  const log=dailyTimeLog(id);
  const active=state.dailyActiveTimer && state.dailyActiveTimer.taskId===id ? state.dailyActiveTimer : null;
  return Math.max(0,Number(log.totalMs)||0) + (active ? Math.max(0,Date.now()-Number(active.startedAt||Date.now())) : 0);
}
function dailyFormatDuration(ms){
  const total=Math.max(0,Math.floor((Number(ms)||0)/1000));
  const h=String(Math.floor(total/3600)).padStart(2,'0');
  const m=String(Math.floor(total%3600/60)).padStart(2,'0');
  const s=String(total%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function dailySignedMinutes(ms){
  const n=Math.round((Number(ms)||0)/60000);
  return `${n>0?'+':''}${n} min`;
}
/* Timer checkpoints run every few seconds; extend the previous session when contiguous so history doesn't balloon. */
function logSession(log,startedAt,endedAt){
  if(!Array.isArray(log.sessions)) log.sessions=[];
  const last=log.sessions[log.sessions.length-1];
  if(last && last.endedAt===startedAt){ last.endedAt=endedAt; last.durationMs=(Number(last.durationMs)||0)+(endedAt-startedAt); }
  else log.sessions.push({startedAt,endedAt,durationMs:endedAt-startedAt});
}
function dailyStopTimer(save=true){
  const active=state.dailyActiveTimer;
  if(!active || !active.taskId) return;
  const log=dailyTimeLog(active.taskId);
  const endedAt=Date.now();
  const duration=Math.max(0,endedAt-Number(active.startedAt||endedAt));
  if(duration>0){
    log.totalMs=(Number(log.totalMs)||0)+duration;
    logSession(log,Number(active.startedAt||endedAt),endedAt);
  }
  state.dailyActiveTimer=null;
  if(save) saveState();
}
function dailyCheckpointTimer(){
  const active=state.dailyActiveTimer;
  if(!active || !active.taskId) return;
  const now=Date.now();
  const started=Number(active.startedAt||now);
  const duration=Math.max(0,now-started);
  if(!duration) return;
  const log=dailyTimeLog(active.taskId);
  log.totalMs=(Number(log.totalMs)||0)+duration;
  logSession(log,started,now);
  active.startedAt=now;
}
function dailyStartTimer(taskId){
  if(state.dailyActiveTimer && state.dailyActiveTimer.taskId===taskId){
    dailyStopTimer(true);
    updateDailyTimerDisplays();
    return;
  }
  if(state.dailyActiveTimer) dailyStopTimer(false);
  dailyTimeLog(taskId);
  state.dailyActiveTimer={taskId,startedAt:Date.now()};
  saveState();
  updateDailyTimerDisplays();
}

  document.querySelectorAll('[data-timer-display]').forEach(el=>{
    el.textContent=dailyFormatDuration(dailyCurrentMs(el.dataset.timerDisplay));
    const active=!!(state.dailyActiveTimer&&state.dailyActiveTimer.taskId===el.dataset.timerDisplay);
    el.classList.toggle('active',active);
  });
  document.querySelectorAll('[data-act="dailytimer"]').forEach(el=>{
    const active=!!(state.dailyActiveTimer&&state.dailyActiveTimer.taskId===el.dataset.id);
    el.textContent=active?'Pause':'Start';

function attachFloatTimerDrag(){
  const el=document.getElementById('mz-float-timer');
  if(!el) return;
  const head=el.querySelector('.mz-float-head');
  if(!head) return;
  const rect=el.getBoundingClientRect();
  el.style.left=rect.left+'px'; el.style.top=rect.top+'px';
  el.style.right='auto'; el.style.bottom='auto';
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  head.addEventListener('pointerdown',e=>{
    if(e.target.closest('.mz-float-close')) return; // don't hijack the close button's click
    dragging=true; sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop;
    try{ head.setPointerCapture(e.pointerId); }catch(err){}
  });
  head.addEventListener('pointermove',e=>{
    if(!dragging) return;
    el.style.left=Math.max(4,Math.min(window.innerWidth-el.offsetWidth-4, ox+(e.clientX-sx)))+'px';
    el.style.top=Math.max(4,Math.min(window.innerHeight-el.offsetHeight-4, oy+(e.clientY-sy)))+'px';
  });
  head.addEventListener('pointerup',()=>{ dragging=false; });
  head.addEventListener('pointercancel',()=>{ dragging=false; });
}
function questionAccuracySummary(fromIso,toIso){
  const entries = Object.values(state.questionAccuracy||{}).filter(e=>e && e.date>=fromIso && e.date<=toIso);
  const planned = entries.reduce((s,e)=>s+(e.planned||0),0);
  const attempted = entries.reduce((s,e)=>s+(e.attempted||0),0);
  const correct = entries.reduce((s,e)=>s+(e.correct||0),0);
  return {count:entries.length, planned, attempted, correct,
    accuracyPct: attempted ? Math.round(correct/attempted*100) : 0};
}
function dailySummary(dateIso){
  const tasks=dailyTasksForDate(dateIso);
  const targetMs=tasks.reduce((sum,t)=>sum+t.target*60000,0);
  const actualMs=tasks.reduce((sum,t)=>sum+dailyCurrentMs(t.id),0);
  const done=tasks.filter(t=>t.done).length;
  return {date:dateIso,tasks,targetMs,actualMs,done,total:tasks.length,
    pct:tasks.length?Math.round(done/tasks.length*100):0,
    varianceMs:actualMs-targetMs};
}
function dailyMinutes(ms){ return Math.round((Number(ms)||0)/60000); }
function dailyImprovement(current,previous){
  if(!previous.length) return null;
  const curMinutes=current.reduce((sum,s)=>sum+dailyMinutes(s.actualMs),0)/Math.max(1,current.length);
  const prevMinutes=previous.reduce((sum,s)=>sum+dailyMinutes(s.actualMs),0)/Math.max(1,previous.length);
  const curPct=current.reduce((sum,s)=>sum+s.pct,0)/Math.max(1,current.length);
  const prevPct=previous.reduce((sum,s)=>sum+s.pct,0)/Math.max(1,previous.length);
  return {minutes:Math.round(curMinutes-prevMinutes),pct:Math.round(curPct-prevPct)};
}

function checkReminder(){

function reminderIcs(){

function renderDailySubTaskRow(task){

/* Groups each Lecture task with its matching same-chapter Notes task (rendered nested
   inside it) so Notes never appears as its own top-level row. */
function renderDailyTaskRows(tasks){
  const nested=new Set();
  tasks.forEach(t=>{
    if(t.type!=='lecture') return;
    const n=tasks.find(o=>o.type==='notes' && o.subject===t.subject && o.chapter===t.chapter && !nested.has(o.id));
    if(n) nested.add(n.id);
  });
  const html=[];
  tasks.forEach(t=>{
    if(t.type==='notes' && nested.has(t.id)) return;
    if(t.type==='lecture'){
      const n=tasks.find(o=>o.type==='notes' && o.subject===t.subject && o.chapter===t.chapter && nested.has(o.id));
      html.push(renderDailyTaskRow(t,n));
      return;
    }
    html.push(renderDailyTaskRow(t));
  });
  return html.join('');
}

let progRange = 'last7', progOffset = 0, progHide = {};   // Progress: window type, weeks back, hidden lines
function isoDow(iso){ const q=iso.split('-').map(Number); return new Date(Date.UTC(q[0],q[1]-1,q[2])).getUTCDay(); }
function progWindowStart(){
  const today=todayISO();
  const base = progRange==='week' ? addDays(today,-((isoDow(today)+6)%7)) : addDays(today,-6);
  return addDays(base,-7*progOffset);
}
function progEarliest(){
  const ds=state.tasks.map(t=>t.date).concat(Object.values(state.questionAccuracy||{}).map(e=>e&&e.date)).filter(Boolean);
  return ds.length ? ds.reduce((a,b)=>a<b?a:b) : todayISO();
}
function progQByDate(){
  const m={}; Object.values(state.questionAccuracy||{}).forEach(e=>{ if(e && e.date) m[e.date]=(m[e.date]||0)+(e.attempted||0); });
  return m;
}
function progRows(start){
  const today=todayISO(), qBy=progQByDate(), rows=[];
  for(let i=0;i<7;i++){
    const d=addDays(start,i);
    if(d>today){ rows.push({date:d,future:true}); continue; }
    const sm=dailySummary(d);
    rows.push({date:d,pct:sm.pct,done:sm.done,total:sm.total,hrs:sm.actualMs/3600000,q:qBy[d]||0});
  }
  return rows;
}
function progTotals(rows){
  const live=rows.filter(r=>!r.future), t={days:live.length,done:0,total:0,hrs:0,q:0};
  live.forEach(r=>{ t.done+=r.done; t.total+=r.total; t.hrs+=r.hrs; t.q+=r.q; });
  t.pct=t.total?Math.round(t.done/t.total*100):null; t.has=!!(t.total||t.hrs||t.q);
  return t;
}
function progPeaks(){   // best single day so far: keeps the scale steady while you browse weeks
  const today=todayISO(); let h=0,q=0;
  dailyDatesWithTasks().forEach(d=>{ if(d<=today) h=Math.max(h,dailySummary(d).actualMs/3600000); });
  Object.values(progQByDate()).forEach(v=>{ q=Math.max(q,v); });
  return {h,q};
}
function progFmtH(h){ const m=Math.round(h*60); return m>=60 ? Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':'') : m+'m'; }
function renderProgressNav(){
  const start=progWindowStart(), end=addDays(start,6), thisYear=todayISO().slice(0,4);
  const label=mzShortDate(start)+' – '+mzShortDate(end)+(end.slice(0,4)!==thisYear?', '+end.slice(0,4):'');
  const tag = progOffset===0 ? (progRange==='week'?'This week':'Last 7 days') : mzPlural(progOffset,'week')+' ago';
  const canOlder = start>progEarliest();
  const chev=d=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

function renderProgressChart(){
  const today=todayISO(), NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const start=progWindowStart(), rows=progRows(start), prev=progTotals(progRows(addDays(start,-7))), cur=progTotals(rows);
  const live=rows.filter(r=>!r.future), peaks=progPeaks();
  const hS=Math.max(1,peaks.h), qS=Math.max(10,peaks.q);

  const delta=(d,txt)=>{
    if(!prev.has) return '<em class="pg-d flat">No earlier week to compare</em>';
    if(d===null) return '<em class="pg-d flat">&nbsp;</em>';
    return d===0 ? '<em class="pg-d flat">Same as the week before</em>'
      : `<em class="pg-d ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${txt} <u>vs week before</u></em>`;
  };
  const dP=(cur.pct!==null&&prev.pct!==null)?cur.pct-prev.pct:null;
  const dH=Math.round((cur.hrs-prev.hrs)*60), dQ=cur.q-prev.q;

  const cards=`<div class="pg-kpis">
    ${card('t','Tasks done',cur.pct===null?'—':cur.pct+'%',cur.total?`${cur.done} of ${cur.total} tasks`:'none planned',delta(dP,Math.abs(dP||0)+' pts'))}
    ${card('h','Study time',progFmtH(cur.hrs),`${progFmtH(avgH)} a day`,delta(dH,progFmtH(Math.abs(dH)/60)))}
    ${card('q','Questions',String(cur.q),`${avgQ} a day`,delta(dQ,String(Math.abs(dQ))))}
  </div>`;
  // ---- chart
  const W=720,H=268,L=42,R=14,T=14,B=46, pw=W-L-R, ph=H-T-B, band=pw/7;
  const cx=i=>L+band*(i+.5), yy=(v,max)=>T+ph*(1-Math.min(1,v/max));
  const series=[{k:'t',val:r=>r.pct,max:100},{k:'h',val:r=>r.hrs,max:hS},{k:'q',val:r=>r.q,max:qS}];
  let g='';
  for(let i=0;i<=4;i++){ const y=T+ph*i/4; g+=`<line class="pg-grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="pg-ax" x="${L-8}" y="${y+3.5}" text-anchor="end">${100-25*i}%</text>`; }
  rows.forEach((r,i)=>{
    const now=r.date===today, dn=NAMES[isoDow(r.date)], num=Number(r.date.slice(8));
    if(now) g+=`<rect class="pg-todaycap" x="${cx(i)-24}" y="${H-B+8}" width="48" height="34" rx="12"/>`;
    g+=`<text class="pg-xd ${now?'now':''} ${r.future?'fut':''}" x="${cx(i)}" y="${H-B+23}" text-anchor="middle">${dn}</text><text class="pg-xn ${now?'now':''} ${r.future?'fut':''}" x="${cx(i)}" y="${H-B+37}" text-anchor="middle">${num}</text>`;
  });
  series.forEach(se=>{
    if(!vis(se.k)) return;
    const pts=live.map(r=>[cx(rows.indexOf(r)),yy(se.val(r),se.max)]);
    if(pts.length>1){
      const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
      if(se.k==='t') g+=`<path class="pg-area pg-t" d="${d} L${pts[pts.length-1][0].toFixed(1)} ${T+ph} L${pts[0][0].toFixed(1)} ${T+ph} Z"/>`;
      g+=`<path class="pg-line pg-${se.k}" d="${d}"/>`;
    }
    pts.forEach((q,i)=>{ const now=live[i].date===today; g+=`<circle class="pg-dot pg-${se.k} ${now?'last':''}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${now?4.4:3.3}"/>`; });
  });
  const keys=['t','h','q'].filter(vis);
  rows.forEach((r,i)=>{
    if(r.future) return;
    const tw=178, th=34+keys.length*18, tx=Math.min(Math.max(cx(i)-tw/2,L+2),W-R-tw-2), ty=T+4;
    const val={t:r.total?`${r.done}/${r.total} · ${r.pct}%`:'none planned',h:progFmtH(r.hrs),q:String(r.q)}, lab={t:'Tasks',h:'Study',q:'Questions'};
    const lines=keys.map((k,n)=>`<circle class="pg-dot pg-${k} on" cx="${tx+14}" cy="${ty+37+n*18-4}" r="3.8"/><text class="pg-tl" x="${tx+26}" y="${ty+37+n*18}">${lab[k]}</text><text class="pg-tv" x="${tx+tw-12}" y="${ty+37+n*18}" text-anchor="end">${val[k]}</text>`).join('');
    g+=`<g class="pg-day"><rect class="pg-hit" x="${L+band*i}" y="${T}" width="${band}" height="${ph}"/><g class="pg-tip"><rect class="pg-tipbg" x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="11"/><text class="pg-tt" x="${tx+12}" y="${ty+20}">${escHtml(mzShortDate(r.date,true))}</text>${lines}</g></g>`;
  });
  if(!cur.has) g+=`<text class="pg-empty" x="${L+pw/2}" y="${T+ph/2}" text-anchor="middle">Nothing logged this week. Add tasks, run a timer or log PYQs.</text>`;
  return `${cards}
    <div class="pg-scroll"><svg class="pg-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily tasks completed, study time and questions attempted">${g}</svg></div>
    <p class="pg-note">Tasks use the % scale. Study time and questions are scaled to your best day so far (${progFmtH(peaks.h||0)} · ${peaks.q||0} questions), so weeks stay comparable. Tap a card to hide or show its line.</p>`;
}

/* ============================ BACKUP / RESTORE ============================ */
function downloadJson(data,filename){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function buildDataExport(){
  dailyCheckpointTimer();
  const clone=v=>JSON.parse(JSON.stringify(v));
  return {
    format:BACKUP_FORMAT, version:BACKUP_VERSION, exportedAt:new Date().toISOString(),
    settings:{
      theme:state.theme, holidayWeekday:state.holidayWeekday,
      examName:state.examName, examDate:state.examDate, examPromptDismissed:state.examPromptDismissed,
      reminder:clone(state.reminder),
      chapterListVersion:state.chapterListVersion,
      subjectLectureLinks:clone(state.subjectLectureLinks),   // per-subject default lecture links (Syllabus settings)
      // dailyActiveTimer deliberately excluded — dailyCheckpointTimer() above already flushed any
      // elapsed time into timeLogs, and restoring a "live" timer's old startedAt on another device/day
      // would inflate its next logged session, so a restore always starts with no timer running.
      aiProvider:state.aiProvider, aiModel:state.aiModel, aiGroqModel:state.aiGroqModel, aiOpenRouterModel:state.aiOpenRouterModel,
      // API keys deliberately excluded — never included in backups (see Settings note)
      aiNudge:clone(state.aiNudge),
      testCategories:clone(state.testCategories)
    },
    tasks:clone(state.tasks),
    chapterList:clone(state.chapterList),                     // includes every chapter's own video link
    syllabus:clone(state.syllabus),
    tests:clone(state.tests),
    timeLogs:clone(state.dailyTimeLogs),
    questionAccuracy:clone(state.questionAccuracy),
    aiChat:clone(state.aiChat)
  };
}
function stateFromDataExport(data){
  if(!data || typeof data!=='object') return null;
  const s=data.settings||{};
  return Object.assign({},s,{
    tasks:Array.isArray(data.tasks) ? data.tasks : undefined,
    syllabus:data.syllabus, tests:data.tests, chapterList:data.chapterList,
    dailyTimeLogs:data.timeLogs || s.dailyTimeLogs,
    questionAccuracy:data.questionAccuracy || (data.progress||{}).questionAccuracy,
    aiChat:Array.isArray(data.aiChat) ? data.aiChat : s.aiChat,
    subjectLectureLinks:data.subjectLectureLinks || s.subjectLectureLinks,
    dailySetups:s.dailySetups, dailyTaskStatus:s.dailyTaskStatus
  });
}
function exportData(){
  saveState();
  downloadJson(buildDataExport(),'manzil-planner-data-'+todayISO()+'.json');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      let candidate=parsed;
      if(parsed && parsed.format===BACKUP_FORMAT) candidate=stateFromDataExport(parsed);
      else if(parsed && parsed.format===LEGACY_BACKUP_FORMAT && parsed.state) candidate=parsed.state;
      if(!candidate || (!Array.isArray(candidate.tasks) && !candidate.dailySetups)){
        alert("This file doesn't look like a valid Manzil backup."); return;
      }
      const previous=state;
      state=migrateState(candidate);
      if(!saveState()){ state=previous; alert('The backup was read, but the browser could not save it. Your current data was not replaced.'); return; }
      state.view='settings'; render();
      alert('Backup imported successfully.');
    }catch(err){ alert('Could not read this file. Make sure it is a valid backup JSON.'); }
  };
  reader.readAsText(file);
}

/* ============================ AI STUDY ASSISTANT ============================ */
let aiSending=false, aiNudgeLoading=false, aiNudgeFailedOn='';
function resetAiNudge(){ state.aiNudge={date:'',text:''}; aiNudgeFailedOn=''; }
function aiProvider(){ return ['groq','openrouter'].includes(state.aiProvider) ? state.aiProvider : 'gemini'; }
function aiProviderName(){ return aiProvider()==='groq'?'Groq':aiProvider()==='openrouter'?'OpenRouter':'Gemini'; }
function aiHasKey(){
  const p=aiProvider();
  return p==='groq' ? !!(state.aiGroqApiKey&&state.aiGroqApiKey.trim())
    : p==='openrouter' ? !!(state.aiOpenRouterApiKey&&state.aiOpenRouterApiKey.trim())
    : !!(state.aiApiKey&&state.aiApiKey.trim());
}
async function geminiCall(input, systemInstruction){
  const key=(state.aiApiKey||'').trim();
  if(!key) throw new Error('Add your Gemini API key in Settings first.');
  const model=(state.aiModel||'gemini-3.8-flash').trim()||'gemini-3.8-flash';
  const contents = typeof input==='string' ? [{role:'user',parts:[{text:input}]}] : input;
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
  const body={contents};
  if(systemInstruction) body.systemInstruction={parts:[{text:systemInstruction}]};
  let res;
  try{ res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Network error — check your internet connection.'); }
  if(!res.ok){
    let msg='Gemini error '+res.status;
    try{ const j=await res.json(); if(j && j.error && j.error.message) msg=j.error.message; }catch(e){}
    throw new Error(msg);
  }
  const data=await res.json();
  const cand=data && data.candidates && data.candidates[0];
  const text=cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||'').join('') : '';
  if(!text) throw new Error('Gemini returned an empty response (it may have been blocked by safety filters).');
  return text.trim();
}
async function groqCall(input, systemInstruction, requestOptions){
  const key=(state.aiGroqApiKey||'').trim();
  if(!key) throw new Error('Add your Groq API key in Settings first.');
  const model=(state.aiGroqModel||'openai/gpt-oss-20b').trim()||'openai/gpt-oss-20b';
  // Groq uses OpenAI-style chat messages: [{role:'system'|'user'|'assistant', content}]
  const msgs=[];
  if(systemInstruction) msgs.push({role:'system',content:systemInstruction});
  if(typeof input==='string'){
    msgs.push({role:'user',content:input});
  }else{
    (input||[]).forEach(m=>{
      const text=(m.parts||[]).map(p=>p.text||'').join('');
      msgs.push({role:m.role==='model'?'assistant':'user',content:text});
    });
  }
  const url='https://api.groq.com/openai/v1/chat/completions';
  const body={model,messages:msgs};
  if(requestOptions && typeof requestOptions==='object') Object.assign(body,requestOptions);
  let res;
  try{ res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Network error — check your internet connection.'); }
  if(!res.ok){
    let msg='Groq error '+res.status;
    try{ const j=await res.json(); if(j && j.error && j.error.message) msg=j.error.message; }catch(e){}
    throw new Error(msg);
  }
  const data=await res.json();
  const choice=data && data.choices && data.choices[0], message=choice&&choice.message;
  const raw=message&&message.content;
  const text=typeof raw==='string'?raw:Array.isArray(raw)?raw.map(p=>p&&p.text||'').join(''):'';
  if(!text.trim()){
    const detail=choice&&choice.finish_reason==='length'?' (the output limit was reached)':message&&message.reasoning?' (reasoning was returned without a final answer)':'';
    throw new Error('Groq returned an empty response'+detail+'.');
  }
  return text.trim();
}
async function openRouterCall(input, systemInstruction, requestOptions){
  const key=(state.aiOpenRouterApiKey||'').trim();
  if(!key) throw new Error('Add your OpenRouter API key in Settings first.');
  const model=(state.aiOpenRouterModel||'openai/gpt-4o-mini').trim()||'openai/gpt-4o-mini';
  const messages=[];
  if(systemInstruction) messages.push({role:'system',content:systemInstruction});
  if(typeof input==='string') messages.push({role:'user',content:input});
  else (input||[]).forEach(m=>{
    const content=(m.parts||[]).map(p=>p.text||'').join('');
    messages.push({role:m.role==='model'?'assistant':'user',content});
  });
  const body={model,messages};
  if(requestOptions && typeof requestOptions==='object') Object.assign(body,requestOptions);
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+key,'X-Title':'Manzil Study Dashboard'};
  if(location.origin && location.origin!=='null') headers['HTTP-Referer']=location.origin;
  let res;
  try{ res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers,body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Network error — check your internet connection.'); }
  if(!res.ok){
    let msg='OpenRouter error '+res.status;
    try{ const j=await res.json(); if(j&&j.error&&j.error.message) msg=j.error.message; }catch(e){}
    throw new Error(msg);
  }
  const data=await res.json(), message=data&&data.choices&&data.choices[0]&&data.choices[0].message;
  const raw=message&&message.content;
  const text=typeof raw==='string'?raw:Array.isArray(raw)?raw.map(p=>p&&p.text||'').join(''):'';
  if(!text.trim()) throw new Error('OpenRouter returned an empty response.');
  return text.trim();
}
function aiCall(input, systemInstruction, providerOptions){
  const p=aiProvider();
  return p==='groq'?groqCall(input,systemInstruction,providerOptions)
    :p==='openrouter'?openRouterCall(input,systemInstruction,providerOptions)
    :geminiCall(input,systemInstruction);
}
function aiContextSummary(){
  const today=dailySummary(todayISO()), streak=computeStreak(), n=examDaysLeft();
  const subjLines=SUBJECTS.map(s=>{ const p=lectureProgress(s.id); return `${s.name} ${p.done}/${p.total} lectures`; }).join(', ');
  const qAcc=questionAccuracySummary(addDays(todayISO(),-6),todayISO());
  const pending=today.tasks.filter(t=>!t.done).map(t=>`${TASK_TYPES[t.type].label} · ${t.chapter}`).join('; ')||'none';
  return [
    `You are a concise, encouraging JEE study assistant built into the student's personal planner app "Manzil".`,
    `Today's date: ${fmtDate(todayISO())}.`,
    n!==null ? `Exam: ${examLabel()} in ${n} day(s) (${fmtDate(state.examDate)}).` : `No exam date set yet.`,
    `Current streak: ${streak} day(s).`,
    `Today's tasks: ${today.done}/${today.total} done. Pending today: ${pending}.`,
    `Syllabus progress: ${subjLines}.`,
    `Last 7 days: ${qAcc.attempted} questions attempted, ${qAcc.correct} correct (${qAcc.accuracyPct}% accuracy).`,
    `Reply in short, specific, practical sentences (usually 2-5) grounded in this data unless the student asks for more detail. No markdown headers.`
  ].join('\n');
}

let xuLoading=false, xuFailedAt=0, xuError='', xuInfo='';
const XU_STALE_MS=24*3600*1000, XU_RETRY_MS=3*3600*1000;
const XU_TYPES={reg_open:'Registration open',reg_closing:'Closing soon',dates:'Dates announced',other:'Update'};
/* Step 1: plain web search (Google News RSS through a CORS proxy) — no AI tokens, no grounding quota */
const XU_QUERIES={
  JEE:'JEE Main 2027 notification exam date when:60d',
  BITSAT:'BITSAT 2027 (registration OR dates OR application OR result) when:60d',
  MET:'("Manipal MET" OR "MET Manipal") 2027 (registration OR dates OR application OR result) when:60d'
};
const XU_PROXIES=[
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)
];
/* Only the 2027 (2027-28) batch: drop anything that names an earlier cycle (2026, 2026-27, 2025 ...) without 2027 */
function xuIs2027(text){
  const t=String(text||'');
  if(/2027/.test(t)) return true;
  return !/\b20(1\d|2[0-6])\b/.test(t);
}
let xuJsonpId=0;
function xuFetchJsonp(url){
  return new Promise((resolve,reject)=>{
    const callback='manzilXuCallback'+(++xuJsonpId);
    const script=document.createElement('script');
    let settled=false;
    const timer=setTimeout(()=>finish(new Error('News feed request timed out.')),12000);
    function finish(err,value){
      if(settled) return;
      settled=true; clearTimeout(timer);
      try{ delete window[callback]; }catch(e){ window[callback]=undefined; }
      script.remove();
      err?reject(err):resolve(value);
    }
    window[callback]=data=>{
      if(!data || data.status!=='ok') return finish(new Error(data&&data.message||'Could not read the news feed.'));
      finish(null,data);
    };
    script.onerror=()=>finish(new Error('Could not load the news feed.'));
    script.src='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)+'&callback='+callback;
    (document.head||document.documentElement).appendChild(script);
  });
}
async function xuFetchText(url){
  let lastErr;
  for(const mk of XU_PROXIES){
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),12000);
    try{
      const r=await fetch(mk(url),{signal:ctl.signal});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const txt=await r.text();
      if(txt && txt.indexOf('<item>')>=0) return txt;
      throw new Error('empty feed');
    }catch(e){ lastErr=e; }
    finally{ clearTimeout(t); }
  }
  throw lastErr||new Error('search failed');
}
async function xuSearchExam(exam){
  const q=XU_QUERIES[exam];
  const url='https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=en-IN&gl=IN&ceid=IN:en';
  let headlines=[];
  try{
    const feed=await xuFetchJsonp(url);
    headlines=(Array.isArray(feed.items)?feed.items:[]).map(it=>({
      title:String(it.title||'').trim(),
      date:it.pubDate||''
    }));
  }catch(jsonpErr){
    const xml=new DOMParser().parseFromString(await xuFetchText(url),'text/xml');
    headlines=Array.from(xml.querySelectorAll('item')).map(it=>({
      title:((it.querySelector('title')||{}).textContent||'').trim(),
      date:((it.querySelector('pubDate')||{}).textContent||'').trim()
    }));
  }
  const seen=new Set(), out=[];
  headlines.forEach(it=>{
    if(out.length>=6) return;
    const title=String(it.title||'').slice(0,130);
    const key=title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,60);
    if(!title || !xuIs2027(title) || seen.has(key)) return;
    seen.add(key);
    const d=new Date(it.date||'');
    out.push(title+(isNaN(d)?'':' ('+d.toISOString().slice(0,10)+')'));
  });
  return out;
}
async function xuGatherHeadlines(){
  const exams=Object.keys(XU_QUERIES);
  const res=await Promise.allSettled(exams.map(xuSearchExam));
  if(res.every(r=>r.status==='rejected')) throw new Error('Could not reach the news search. Check your connection and try again.');
  // Step 2: compact — one short line per headline, grouped by exam
  return exams.map((e,i)=>res[i].status==='fulfilled'&&res[i].value.length?e+':\n'+res[i].value.map(h=>'- '+h).join('\n'):'').filter(Boolean).join('\n');
}
function parseExamUpdates(text){
  const a=text.indexOf('{'), b=text.lastIndexOf('}');
  if(a<0||b<a) throw new Error('Could not read the AI reply');
  const j=JSON.parse(text.slice(a,b+1));
  const out=[], per={};
  (Array.isArray(j.updates)?j.updates:[]).forEach(u=>{
    if(!u) return;
    const raw=String(u.exam||'').toUpperCase();
    const exam=raw.indexOf('BITSAT')>=0?'BITSAT':raw.indexOf('MET')>=0?'MET':raw.indexOf('JEE')>=0?'JEE':'';
    const type=XU_TYPES[u.type]?u.type:'other';
    const title=String(u.title||'').trim().slice(0,140);
    if(!exam||!title||!xuIs2027(title)) return;
    per[exam]=(per[exam]||0)+1; if(per[exam]>3) return;
    out.push({exam,type,title,date:String(u.date||'').trim().slice(0,60)});
  });
  const order={JEE:0,BITSAT:1,MET:2};
  return out.sort((x,y)=>order[x.exam]-order[y.exam]);
}
function xuFallbackUpdates(headlineText){
  const out=[], per={}, order={JEE:0,BITSAT:1,MET:2};
  let exam='';
  headlineText.split(/\r?\n/).forEach(line=>{
    const group=line.trim().match(/^(JEE|BITSAT|MET):$/i);
    if(group){ exam=group[1].toUpperCase(); return; }
    if(!exam || !/^\s*-\s+/.test(line) || (per[exam]||0)>=3) return;
    const match=line.replace(/^\s*-\s+/,'').match(/^(.*?)(?:\s+\((\d{4}-\d{2}-\d{2})\))?$/);
    const title=(match&&match[1]||'').trim().slice(0,140);
    if(!title) return;
    const lower=title.toLowerCase();
    const type=/\b(registration|application)\b/.test(lower)&&/\b(open|opens|opened|start|starts|started|begin|begins|began)\b/.test(lower)?'reg_open'
      :/\b(last date|last day|deadline|closing|closes|closed|extended)\b/.test(lower)?'reg_closing'
      :/\b(exam|session|date|dates|schedule)\b/.test(lower)&&/\b(announc|released|release|out|schedule|date)\b/.test(lower)?'dates'
      :'other';
    per[exam]=(per[exam]||0)+1;
    out.push({exam,type,title,date:match&&match[2]||''});
  });
  return out.sort((x,y)=>order[x.exam]-order[y.exam]);
}
function xuProviderJsonOptions(){
  if(aiProvider()==='openrouter') return {response_format:{type:'json_object'},max_tokens:1200};
  if(aiProvider()!=='groq') return null;
  const model=(state.aiGroqModel||'openai/gpt-oss-20b').trim();
  if(!/^openai\/gpt-oss-(20b|120b)$/i.test(model)) return null;
  return {response_format:{type:'json_object'},max_completion_tokens:1200,reasoning_effort:'low',reasoning_format:'hidden'};
}
async function refreshExamUpdates(force){
  if(xuLoading || !aiHasKey()) return;
  // Background loads respect the 24 h cache; a manual refresh must check again.
  const xu0=state.examUpdates;
  if(!force && xu0.ts && Date.now()-xu0.ts<XU_STALE_MS){
    return;
  }
  xuLoading=true; xuError=''; xuInfo=''; render();
  try{
    const headlines=await xuGatherHeadlines();
    let items=[], source='ai';
    if(headlines){
      const prompt=`Today is ${fmtDate(todayISO())}. Below are recent news headlines about JEE (Main/Advanced), BITSAT and MET (Manipal). Using ONLY these headlines, list the latest admission-cycle announcements: registration started, registration closing / last date, exam or session dates released, admit card, results. Skip anything not clearly stated in a headline and never invent dates. Only include items about the 2027 admission cycle (the 2027-28 batch); ignore anything about 2026 or earlier cycles. Max 3 items per exam, newest first. If an exam has nothing relevant, omit it.
${headlines}

Reply with ONLY valid JSON, no markdown, in this exact shape:
{"updates":[{"exam":"JEE"|"BITSAT"|"MET","type":"reg_open"|"reg_closing"|"dates"|"other","title":"short headline, max 12 words","date":"the date or deadline stated in the headline, or empty"}]}`;
      try{
        items=parseExamUpdates(await aiCall(prompt,undefined,xuProviderJsonOptions()));   // Structured output where the selected provider supports it.
      }catch(aiErr){
        const badReply=aiErr&&(aiErr.name==='SyntaxError'||/returned an empty response|could not read the ai reply/i.test(aiErr.message||''));
        const fallback=badReply?xuFallbackUpdates(headlines):[];
        if(!fallback.length) throw aiErr;
        items=fallback; source='headlines';
        xuInfo=aiProviderName()+' returned no usable summary; showing the news headlines instead.';
      }
    }
    state.examUpdates={ts:Date.now(),items,source}; xuFailedAt=0; saveState();   // Step 4: save
  }catch(err){ xuFailedAt=Date.now(); xuError=(err&&err.message)||'Could not fetch updates'; console.warn('Exam updates failed',err); }
  xuLoading=false; render();
}
function maybeFetchExamUpdates(){
  if(xuLoading || !aiHasKey()) return;
  if(Date.now()-xuFailedAt<XU_RETRY_MS) return;
  if(Date.now()-(state.examUpdates.ts||0)<XU_STALE_MS) return;
  setTimeout(()=>refreshExamUpdates(false),0);
}
function xuAgo(ts){
  if(!ts) return '';
  const m=Math.round((Date.now()-ts)/60000);
  return m<2?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';
}
function renderExamUpdates(){
  const xu=Object.assign({},state.examUpdates,{items:(state.examUpdates.items||[]).filter(u=>xuIs2027(u.title))}), has=aiHasKey();
  let body;
  if(!has) body=`<div class="xu-note">Add your AI key in Settings to load live JEE, BITSAT and MET updates.</div>`;
  else if(xuLoading && !xu.items.length) body=`<div class="xu-note">Checking official sources…</div>`;
  else if(xuError && !xu.items.length) body=`<div class="xu-note">Couldn't load updates: ${escHtml(xuError)}</div>`;
  else if(!xu.ts) body=`<div class="xu-note">Checking official sources…</div>`;
  else if(!xu.items.length) body=`<div class="xu-note">No new announcements found right now.</div>`;
  else body=(xuError?`<div class="xu-note">Refresh failed: ${escHtml(xuError)}. Showing saved updates.</div>`:'')+xu.items.map(u=>`<div class="xu-item"><div class="xu-top"><span class="xu-exam">${escHtml(u.exam)}</span><span class="xu-chip ${u.type}">${XU_TYPES[u.type]}</span></div><div class="xu-title">${escHtml(u.title)}</div>${u.date?`<div class="xu-date">${escHtml(u.date)}</div>`:''}</div>`).join('');
  return `<div class="card glance xu-card">
    <div class="xu-head"><div class="section-title">EXAM UPDATES</div>${has?`<button class="xu-refresh" type="button" data-act="xurefresh" ${xuLoading?'disabled':''}>${xuLoading?'Checking…':'Refresh'}</button>`:''}</div>
    <div class="xu-list">${body}</div>
  </div>`;
}
function aiScrollToBottom(){
  const el=document.getElementById('ai-chat-messages');
  if(el) el.scrollTop=el.scrollHeight;
}
async function aiSendMessage(text){
  text=(text||'').trim();
  if(!text || aiSending || !aiHasKey()) return;
  state.aiChat.push({role:'user',text,ts:Date.now()});
  state.aiChat=state.aiChat.slice(-40);
  saveState(); aiSending=true; render(); aiScrollToBottom();
  try{
    const history=state.aiChat.filter(m=>m.kind!=='error').slice(-12).map(m=>({role:m.role,parts:[{text:m.text}]}));
    while(history.length && history[0].role!=='user') history.shift();
    const reply=await aiCall(history, aiContextSummary());
    state.aiChat.push({role:'model',text:reply,ts:Date.now()});
  }catch(err){
    state.aiChat.push({role:'model',text:(err&&err.message)||('Something went wrong talking to '+aiProviderName()+'.'),ts:Date.now(),kind:'error'});
  }
  state.aiChat=state.aiChat.slice(-40);
  aiSending=false; saveState(); render(); aiScrollToBottom();
  if(state.aiChat.length && state.aiChat[state.aiChat.length-1].kind!=='error') refreshAiSuggestions();
}
function maybeFetchDailyNudge(){
  if(!aiHasKey() || aiNudgeLoading || aiSending || aiNudgeFailedOn===todayISO()) return;
  if(state.aiNudge && state.aiNudge.date===todayISO()) return;
  aiNudgeLoading=true;
  const prompt=aiContextSummary()+`\n\nGive the student one short, specific, encouraging nudge or suggestion for today (2-3 sentences max), based on the data above.`;
  aiCall(prompt).then(text=>{
    state.aiNudge={date:todayISO(),text};
    state.aiChat.push({role:'model',text,ts:Date.now(),kind:'nudge'});
    state.aiChat=state.aiChat.slice(-40);
    saveState(); aiNudgeLoading=false; render(); aiScrollToBottom(); refreshAiSuggestions();
  }).catch(err=>{ aiNudgeLoading=false; aiNudgeFailedOn=todayISO(); console.warn('AI nudge failed', err); });
}

/* AI is used only here: it proposes follow-up questions based on the latest conversation. */
function refreshAiSuggestions(){
  if(!aiHasKey() || aiSuggestLoading) return;
  const recent=(state.aiChat||[]).filter(m=>m.kind!=='error').slice(-6);
  if(!recent.length) return;
  aiSuggestLoading=true;
  const convo=recent.map(m=>(m.role==='user'?'Student: ':'Assistant: ')+m.text).join('\n');
  const prompt=`Here is a recent conversation between a JEE student and their study assistant:\n${convo}\n\nSuggest 4 short follow-up questions (max 9 words each) the student might naturally ask next. Reply with ONLY a JSON array of 4 strings, no other text.`;
  aiCall(prompt).then(text=>{
    const m=String(text).match(/\[[\s\S]*\]/);
    const arr=m?JSON.parse(m[0]):[];
    const clean=arr.filter(x=>typeof x==='string' && x.trim()).map(x=>x.trim().slice(0,80)).slice(0,4);
    if(clean.length){
      aiSuggestions=clean;
      const box=document.querySelector('.ai-suggest');
      if(box){ box.innerHTML=aiChipsHtml(); bindAiChips(); }
    }
  }).catch(e=>console.warn('AI suggestions failed',e)).finally(()=>{ aiSuggestLoading=false; });
}

/* ---- Planner: month calendar with study hours and questions done ---- */
let plannerMonth = todayISO().slice(0,7);
let plannerView = 'cal';      // 'cal' | 'day'
let plannerFocus = '';        // date opened in the day-wise view
function hm(ms){ const m=Math.round(ms/60000); return m<60 ? m+'m' : Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':''); }
function dayStats(date){
  const tasks=dailyTasksForDate(date);
  let ms=0, q=0;
  tasks.forEach(t=>{ ms+=dailyCurrentMs(t.id); const a=state.questionAccuracy[t.id]; if(a) q+=a.attempted||0; });
  return {ms,q,total:tasks.length,done:tasks.filter(t=>t.done).length};
}
function shiftMonth(n){
  const p=plannerMonth.split('-').map(Number);
  plannerMonth=new Date(Date.UTC(p[0],p[1]-1+n,1)).toISOString().slice(0,7);
}
/* ---- Day-wise view: everything that happened on each day of the month ---- */
function dayTaskTitle(t){
  if(t.type==='dpp' && t.title) return t.title;
  const ty=TASK_TYPES[t.type]||{label:t.type};
  return ty.label+(t.chapter?' – '+t.chapter:'');
}
function dayDetail(date){
  const tasks=dailyTasksForDate(date).map(t=>{
    const log=state.dailyTimeLogs[t.id]||{}, acc=state.questionAccuracy[t.id];
    return {t,ms:dailyCurrentMs(t.id),acc,sessions:(log.sessions||[]).length};
  });
  const tests=state.tests.filter(x=>x.date===date);
  const ms=tasks.reduce((a,x)=>a+x.ms,0);
  let att=0, cor=0; tasks.forEach(x=>{ if(x.acc){ att+=x.acc.attempted||0; cor+=x.acc.correct||0; } });
  return {tasks,tests,ms,att,cor,done:tasks.filter(x=>x.t.done).length};
}
function dwTypeCls(t){ return (TASK_TYPES[t.type]||{}).cls||'core'; }
function renderDayCard(date,open){
  const d=dayDetail(date);
  const bySubj={}; d.tasks.forEach(x=>{ if(x.ms){ const k=x.t.subject||'other'; bySubj[k]=(bySubj[k]||0)+x.ms; } });
  const subjLine=Object.keys(bySubj).map(k=>`<span class="dw-chip s-${escAttr(k)}">${escHtml((subj(k)||{}).name||k)} <b>${hm(bySubj[k])}</b></span>`).join('');
  const rows=d.tasks.map(x=>{
    const meta=[]; if(x.ms) meta.push(ICONS.timer(11)+' '+hm(x.ms)+(x.sessions>1?' · '+x.sessions+' sessions':''));
    if(x.acc) meta.push(ICONS.pencil(11)+' '+(x.acc.correct||0)+'/'+(x.acc.attempted||0)+' correct');
    const sn=(subj(x.t.subject)||{}).name; if(sn) meta.unshift(escHtml(sn));
    const cls=dwTypeCls(x.t), ty=TASK_TYPES[x.t.type]||{badge:''};
    const canDel=!x.t.done && !x.ms;
    return `<div class="dw-task t-${cls} ${x.t.done?'done':''} ${date>todayISO()?'planned':''}"><span class="dw-mark">${x.t.done?'✓':'○'}</span><div><b>${escHtml(dayTaskTitle(x.t))} <i class="dw-badge">${x.t.done?'DONE':ty.badge}</i></b><span>${meta.join(' · ')||(date>todayISO()?'Planned':'&nbsp;')}</span></div>${canDel?`<button type="button" class="dw-del" data-act="plandel" data-id="${escAttr(x.t.id)}" aria-label="Remove task" title="Remove task">✕</button>`:''}</div>`;
  }).join('');
  const tests=d.tests.map(x=>{
    const sc=isScored(x), pct=sc&&x.total?Math.round(x.scored/x.total*100):null;
    return `<div class="dw-task t-test ${sc?'done':''}"><span class="dw-mark">${ICONS.note(13)}</span><div><b>${escHtml(x.name)} <i class="dw-badge">${sc?(pct!==null?pct+'%':'SCORED'):'TEST'}</i></b><span>${escHtml(x.type||'')}${sc?' · scored '+x.scored+' / '+x.total:' · not logged yet'}</span></div></div>`;
  }).join('');
  const empty=!d.tasks.length && !d.tests.length;
  const status=!d.tasks.length ? 'none' : d.done===d.tasks.length ? 'full' : d.done>0 ? 'part' : 'zero';
  const pills=(d.tasks.length?`<span class="dw-pill p-good">${d.done}/${d.tasks.length} tasks</span>`:'')+(d.ms?`<span class="dw-pill p-blue">${ICONS.timer(11)} ${hm(d.ms)}</span>`:'')+
    (d.att?`<span class="dw-pill p-warn">${d.att} Q</span>`:'')+(d.tests.length?`<span class="dw-pill p-pink">${mzPlural(d.tests.length,'test')}</span>`:'')+(empty?`<span class="dw-pill">${date>todayISO()?'Nothing planned':'No activity'}</span>`:'');
  return `<details class="dw-day st-${status} ${date===todayISO()?'today':''}" data-date="${date}" ${open?'open':''}>
    <summary><b>${escHtml(fmtDate(date))}</b><span class="dw-sum">${pills}</span></summary>
    <div class="dw-body">
      <div class="dw-stats"><div class="c-good"><b>${d.done}/${d.tasks.length}</b><span>Tasks done</span></div><div class="c-blue"><b>${hm(d.ms)||'0m'}</b><span>Study time</span></div><div class="c-warn"><b>${d.att}</b><span>Questions</span></div><div class="c-purple"><b>${d.att?Math.round(d.cor/d.att*100)+'%':'–'}</b><span>Accuracy</span></div></div>
      ${subjLine?`<div class="dw-chips">${subjLine}</div>`:''}
      ${rows||tests?`<div class="dw-list">${rows}${tests}</div>`:`<p class="sub" style="margin:8px 0 0">${date>todayISO()?'Nothing planned yet.':'Nothing recorded this day.'}</p>`}
      ${date>=todayISO()?`<div class="dw-addrow"><button type="button" class="btn sm" data-act="plantask" data-date="${date}">＋ Plan a task for ${date===todayISO()?'today':escHtml(mzShortDate(date))}</button></div>`:''}
    </div>
  </details>`;
}
function plannerSelDate(){
  const p=plannerMonth.split('-').map(Number), days=new Date(Date.UTC(p[0],p[1],0)).getUTCDate();
  if(plannerFocus && plannerFocus.slice(0,7)===plannerMonth) return plannerFocus;
  const t=todayISO();
  return t.slice(0,7)===plannerMonth ? t : plannerMonth+'-01';
}
function plannerRelLabel(date){
  const n=mzDaysBetween(todayISO(),date);
  return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n>0?'In '+n+' days':Math.abs(n)+' days ago';
}
function renderDayPanel(date){
  const d=dayDetail(date), today=todayISO(), past=date<today, p=date.split('-').map(Number);
  const wd=new Date(Date.UTC(p[0],p[1]-1,p[2])).toLocaleDateString('en-US',{weekday:'long',timeZone:'UTC'});
